apiVersion: apps/v1
kind: Deployment
metadata:
  name: disassembly-lifecycle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: disassembly-lifecycle
  template:
    metadata:
      labels:
        app: disassembly-lifecycle
        revision: original
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/busybox:1.29-4
          command:
            - sh
            - -c
            - sleep 3600
