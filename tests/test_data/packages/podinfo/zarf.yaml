kind: ZarfPackageConfig
metadata:
  name: podinfo
  version: 0.1.0
  description: Podinfo with Zarf Values templating
values:
  files:
    - values.yaml

components:
  - name: podinfo
    required: true
    images:
      - ghcr.io/stefanprodan/podinfo:6.14.1
    charts:
      - name: podinfo
        version: 6.14.1
        namespace: podinfo
        url: oci://ghcr.io/stefanprodan/charts/podinfo
        values:
          - sourcePath: ".service.enabled"
            targetPath: ".service.enabled"
          - sourcePath: ".pod.annotations"
            targetPath: ".podAnnotations"
          - sourcePath: ".pod.tolerations"
            targetPath: ".tolerations"
          - sourcePath: ".pod.replicaCount"
            targetPath: ".replicaCount"
          - sourcePath: ".logLevel"
            targetPath: ".logLevel"
