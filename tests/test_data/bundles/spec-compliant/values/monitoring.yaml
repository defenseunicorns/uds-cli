# Monitoring configuration values
# These values are passed to the core-monitoring Zarf package
#
# This file demonstrates deploy-time variable templating using {{ .vars.* }} syntax.
# Variables are provided at deploy time via config.uds.hcl

prometheus:
  enabled: true
  server:
    retention: {{ .vars.monitoring.retentionDays }}
    persistentVolume:
      size: {{ .vars.monitoring.prometheusStorageSize }}

grafana:
  enabled: true
  adminPassword: {{ .vars.monitoring.grafanaAdminPassword }}
  persistence:
    enabled: true
    size: {{ .vars.monitoring.grafanaStorageSize }}
