name: Canonical Tests

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate in each test job checkout
        required: false
        type: string
        default: ""
      include_ghcr_write:
        description: Run authenticated GHCR write tests after the standard matrix
        required: false
        type: boolean
        default: false
      include_uds_core_smoke:
        description: Run UDS Core smoke tests after the standard matrix
        required: false
        type: boolean
        default: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup development tools
        uses: ./.github/actions/mise

      - name: Lint the repository
        run: uds run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup development tools
        uses: ./.github/actions/mise

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          uds run test:unit 2>&1 | tee "${RUNNER_TEMP}/uds-command-unit.log"

      - name: Check architecture
        run: uds run test:architecture

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: unit

  docs-link-check:
    name: Docs Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup development tools
        uses: ./.github/actions/mise

      - name: Check UDS Docs links
        run: uds run uds-docs-validate

  build:
    name: Build UDS CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup development tools
        uses: ./.github/actions/mise

      - name: Build CLI
        run: uds run build-cli-linux-amd

      - name: Upload UDS CLI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uds-binary
          path: build/uds
          retention-days: 1

  next-integration-tests:
    name: Next / Integration
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e
        with:
          create-cluster: "false"

      - name: Run Next integration tests
        shell: bash
        run: |
          set -o pipefail
          build/uds run test:next-integration 2>&1 | tee "${RUNNER_TEMP}/uds-command-next-integration.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: next-integration

  next-integration-library-tests:
    name: Next / Integration Library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup development tools
        uses: ./.github/actions/mise

      - name: Run Next library integration tests
        shell: bash
        run: |
          set -o pipefail
          uds run test:next-integration-library 2>&1 | tee "${RUNNER_TEMP}/uds-command-next-integration-library.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: next-integration-library

  next-cluster-tests:
    name: Next / Cluster
    runs-on: uds-ubuntu-big-boy-4-core
    needs: build
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e
        with:
          # Next cluster integration tests create and clean up their own k3d cluster.
          create-cluster: "false"

      - name: Run Next cluster tests
        shell: bash
        run: |
          set -o pipefail
          build/uds run test:next-cluster 2>&1 | tee "${RUNNER_TEMP}/uds-command-next-cluster.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: next-cluster

  e2e-bundle-tests:
    name: Legacy / E2E ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: bundle
            name: Bundle
          - task: deploy-flags
            name: Deploy Flags
          - task: index
            name: Bundle Index
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e

      - name: Run e2e ${{ matrix.task }} tests
        shell: bash
        run: |
          set -o pipefail
          build/uds run test:${{ matrix.task }} 2>&1 | tee "${RUNNER_TEMP}/uds-command-${{ matrix.task }}.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: ${{ matrix.task }}

  e2e-single-tests:
    name: Legacy / E2E ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: dev
            name: Dev
          - task: variable
            name: Variables
          - task: optional-bundle
            name: Optional Bundles
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e

      - name: Run e2e ${{ matrix.task }} tests
        shell: bash
        run: |
          set -o pipefail
          build/uds run test:${{ matrix.task }} 2>&1 | tee "${RUNNER_TEMP}/uds-command-${{ matrix.task }}.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: ${{ matrix.task }}

  e2e-vendor-tests:
    name: Legacy / E2E Vendor and Completion
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e

      - name: Install Trivy
        shell: bash
        run: |
          sudo apt-get install wget apt-transport-https gnupg -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y

      - name: Run e2e vendor tests
        shell: bash
        run: |
          set -o pipefail
          build/uds run test:vendor 2>&1 | tee "${RUNNER_TEMP}/uds-command-vendor.log"

      - name: Save vendor diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: vendor

      - name: Run e2e completion tests
        shell: bash
        run: |
          set -o pipefail
          build/uds run test:completion 2>&1 | tee "${RUNNER_TEMP}/uds-command-completion.log"

      - name: Save completion diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: completion

  e2e-engine-tests:
    name: Legacy / E2E Engine
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e
        with:
          create-cluster: "false"

      - name: Deploy k3d-core-slim-dev
        run: build/uds deploy oci://ghcr.io/defenseunicorns/packages/uds/snapshots/bundles/k3d-core-slim-dev:latest --confirm --packages uds-k3d-dev,init,core-base

      - name: Run e2e engine tests
        shell: bash
        run: |
          set -o pipefail
          build/uds run test:engine-e2e 2>&1 | tee "${RUNNER_TEMP}/uds-command-engine.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: engine

  ghcr-write:
    name: Legacy / E2E GHCR Write
    if: inputs.include_ghcr_write
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - docs-link-check
      - build
      - next-integration-tests
      - next-integration-library-tests
      - next-cluster-tests
      - e2e-bundle-tests
      - e2e-single-tests
      - e2e-vendor-tests
      - e2e-engine-tests
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GHCR write tests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          build/uds run test:e2e-ghcr 2>&1 | tee "${RUNNER_TEMP}/uds-command-ghcr-write.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: ghcr-write

  uds-core-smoke:
    name: Legacy / Smoke UDS Core
    if: inputs.include_uds_core_smoke
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e
        with:
          create-cluster: "false"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run UDS Core smoke test
        shell: bash
        run: |
          set -o pipefail
          build/uds run test:ci-uds-core-smoke-test 2>&1 | tee "${RUNNER_TEMP}/uds-command-uds-core-smoke.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: uds-core-smoke

  next-uds-core-smoke:
    name: Next / Smoke UDS Core
    if: inputs.include_uds_core_smoke
    runs-on: uds-ubuntu-big-boy-4-core
    needs: build
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e
        with:
          create-cluster: "false"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Next UDS Core smoke test
        shell: bash
        run: |
          set -o pipefail
          build/uds run test:next-smoke-uds-core 2>&1 | tee "${RUNNER_TEMP}/uds-command-next-uds-core-smoke.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: next-uds-core-smoke
