name: Canonical Tests

on:
  workflow_call:
    inputs:
      fetch_zarf:
        description: Build the test binary with zarf@main
        required: false
        type: boolean
        default: false
      include_ghcr_write:
        description: Run authenticated GHCR write tests after the standard matrix
        required: false
        type: boolean
        default: false
      include_uds_core_smoke:
        description: Run UDS Core smoke tests after the standard matrix
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup development tools
        uses: ./.github/actions/mise

      - name: Lint the repository
        run: uds run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup development tools
        uses: ./.github/actions/mise

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          uds run test:unit 2>&1 | tee "${RUNNER_TEMP}/uds-command-unit.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: unit

  build:
    name: Build UDS CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup development tools
        uses: ./.github/actions/mise

      - name: Fetch zarf@main
        if: inputs.fetch_zarf
        shell: bash
        run: |
          go get github.com/zarf-dev/zarf@main
          ZARF_VERSION=$(go list -m -json github.com/zarf-dev/zarf | jq -r .Version)
          yq eval "(.packages[] | select(.name == \"init\")).ref = \"$ZARF_VERSION\"" -i src/test/bundles/04-init/uds-bundle.yaml
          yq eval "(.packages[] | select(.name == \"init\")).ref = \"$ZARF_VERSION\"" -i src/test/bundles/14-optional-components/uds-bundle.yaml

      - name: Build CLI
        run: uds run build-cli-linux-amd

      - name: Upload UDS CLI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uds-binary
          path: build/uds
          retention-days: 1

  e2e-bundle-tests:
    name: E2E ${{ matrix.task }}
    runs-on: uds-ubuntu-big-boy-8-core
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        task: [bundle, deploy-flags, index]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e

      - name: Run e2e ${{ matrix.task }} tests
        shell: bash
        run: |
          set -o pipefail
          build/uds run test:${{ matrix.task }} 2>&1 | tee "${RUNNER_TEMP}/uds-command-${{ matrix.task }}.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: ${{ matrix.task }}

  e2e-single-tests:
    name: E2E ${{ matrix.task }}
    runs-on: uds-ubuntu-big-boy-8-core
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        task: [dev, variable, optional-bundle]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e

      - name: Run e2e ${{ matrix.task }} tests
        shell: bash
        run: |
          set -o pipefail
          build/uds run test:${{ matrix.task }} 2>&1 | tee "${RUNNER_TEMP}/uds-command-${{ matrix.task }}.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: ${{ matrix.task }}

  e2e-vendor-tests:
    name: E2E vendor and completion
    runs-on: uds-ubuntu-big-boy-8-core
    needs: build
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e

      - name: Install Trivy
        shell: bash
        run: |
          sudo apt-get install wget apt-transport-https gnupg -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y

      - name: Run e2e vendor and completion tests
        shell: bash
        run: |
          set -o pipefail
          {
            build/uds run test:vendor
            build/uds run test:completion
          } 2>&1 | tee "${RUNNER_TEMP}/uds-command-vendor.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: vendor

  e2e-engine-tests:
    name: E2E engine
    runs-on: uds-ubuntu-big-boy-8-core
    needs: build
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e
        with:
          create-cluster: "false"

      - name: Deploy k3d-core-slim-dev
        run: build/uds deploy oci://ghcr.io/defenseunicorns/packages/uds/snapshots/bundles/k3d-core-slim-dev:latest --confirm --packages uds-k3d-dev,init,core-base

      - name: Run e2e engine tests
        shell: bash
        run: |
          set -o pipefail
          build/uds run test:engine-e2e 2>&1 | tee "${RUNNER_TEMP}/uds-command-engine.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: engine

  ghcr-write:
    name: GHCR Write Tests
    if: inputs.include_ghcr_write
    runs-on: uds-ubuntu-big-boy-8-core
    needs: build
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GHCR write tests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          build/uds run test:e2e-ghcr 2>&1 | tee "${RUNNER_TEMP}/uds-command-ghcr-write.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: ghcr-write

  uds-core-smoke:
    name: UDS Core Smoke Test
    if: inputs.include_uds_core_smoke
    runs-on: uds-ubuntu-big-boy-8-core
    needs: build
    timeout-minutes: 65
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup e2e job
        uses: ./.github/actions/setup-uds-e2e
        with:
          create-cluster: "false"

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run UDS Core smoke test
        shell: bash
        run: |
          set -o pipefail
          build/uds run test:ci-uds-core-smoke-test 2>&1 | tee "${RUNNER_TEMP}/uds-command-uds-core-smoke.log"

      - name: Save diagnostics
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: uds-core-smoke
