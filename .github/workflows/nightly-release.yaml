name: Unstable Release

on:
  schedule:
    - cron: "0 3 * * *" # nightly at 3am UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to release"
        required: false
        default: main
        type: string

concurrency:
  group: unstable-release-${{ github.event_name == 'schedule' && 'nightly' || github.event.inputs.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      tag_name: ${{ steps.prepare.outputs.tag_name }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare unstable release
        id: prepare
        env:
          RELEASE_REF: ${{ github.event.inputs.ref || 'main' }}
          RELEASE_TYPE: ${{ github.event_name == 'schedule' && 'nightly' || 'adhoc' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            git rev-parse --verify "$RELEASE_REF^{commit}" >/dev/null
          elif ! git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_REF" >/dev/null 2>&1; then
            echo "ref must be an existing branch or commit SHA: $RELEASE_REF" >&2
            exit 1
          fi

          stable_tag=
          while read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              stable_tag="$candidate"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)
          test -n "$stable_tag"
          timestamp=$(date -u +%Y%m%d%H%M%S)
          short_sha=$(git rev-parse --short=8 HEAD)
          tag_name="${stable_tag}-${RELEASE_TYPE}+${timestamp}-${short_sha}"

          if git ls-remote --exit-code --refs origin "refs/tags/$tag_name" >/dev/null 2>&1; then
            echo "tag already exists: $tag_name" >&2
            exit 1
          fi

          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    uses: ./.github/workflows/test-release.yaml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets: inherit

  tag:
    needs:
      - prepare
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Push unstable tag
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          git tag "$TAG_NAME" "${{ needs.prepare.outputs.source_sha }}"
          git push origin "refs/tags/$TAG_NAME"

  publish:
    needs:
      - prepare
      - tag
    uses: ./.github/workflows/release-publish.yaml
    permissions:
      contents: write
      packages: write
    with:
      tag_name: ${{ needs.prepare.outputs.tag_name }}
      goreleaser_config: .goreleaser.unstable.yaml
      environment: release-nightly
    secrets: inherit

  cleanup-nightlies:
    needs:
      - prepare
      - publish
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove older nightly releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t nightly_tags < <(gh release list --limit 100 --order desc --json tagName,isPrerelease --jq '.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\+"))) | .tagName')
          for tag_name in "${nightly_tags[@]:3}"; do
            gh release delete "$tag_name" --cleanup-tag --yes
          done
