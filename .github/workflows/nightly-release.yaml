name: Unstable Release

on:
  schedule:
    - cron: "0 3 * * *" # nightly at 3am UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to release"
        required: false
        default: main
        type: string

concurrency:
  group: unstable-release-${{ github.event_name == 'schedule' && 'nightly' || github.event.inputs.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      tag_name: ${{ steps.prepare.outputs.tag_name }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare unstable release
        id: prepare
        env:
          RELEASE_REF: ${{ github.event.inputs.ref || 'main' }}
          RELEASE_TYPE: ${{ github.event_name == 'schedule' && 'nightly' || 'adhoc' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            git rev-parse --verify "$RELEASE_REF^{commit}" >/dev/null
          elif ! git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_REF" >/dev/null 2>&1; then
            echo "ref must be an existing branch or commit SHA: $RELEASE_REF" >&2
            exit 1
          fi

          # Fail before tagging so historical refs without the release config cannot leave orphaned tags.
          if ! git cat-file -e HEAD:.goreleaser.unstable.yaml; then
            echo "selected ref does not contain .goreleaser.unstable.yaml" >&2
            exit 1
          fi

          stable_tag=
          while read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              stable_tag="$candidate"
              break
            fi
          done < <(git tag --list 'v*' --sort=-version:refname)
          test -n "$stable_tag"
          timestamp=$(date -u +%Y%m%d%H%M%S)
          short_sha=$(git rev-parse --short=8 HEAD)
          tag_name="${stable_tag}-${RELEASE_TYPE}+${timestamp}-${short_sha}"

          if git ls-remote --exit-code --refs origin "refs/tags/$tag_name" >/dev/null 2>&1; then
            echo "tag already exists: $tag_name" >&2
            exit 1
          fi

          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    uses: ./.github/workflows/test-release.yaml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets: inherit

  tag:
    needs:
      - prepare
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Push unstable tag
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          git tag "$TAG_NAME" "${{ needs.prepare.outputs.source_sha }}"
          git push origin "refs/tags/$TAG_NAME"

  publish:
    needs:
      - prepare
      - tag
    runs-on: ubuntu-latest
    environment: release-nightly
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup development tools
        uses: ./.github/actions/mise

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Setup release environment
        shell: bash
        run: |
          set -euo pipefail
          K8S_MODULES_VER=$(go list -f '{{.Version}}' -m k8s.io/client-go | sed 's/v//; s/\./ /g')
          echo K8S_MODULES_MAJOR_VER=$(expr $(echo "$K8S_MODULES_VER" | cut -d " " -f 1) + 1) >> "$GITHUB_ENV"
          echo K8S_MODULES_MINOR_VER=$(echo "$K8S_MODULES_VER" | cut -d " " -f 2) >> "$GITHUB_ENV"
          echo K8S_MODULES_PATCH_VER=$(echo "$K8S_MODULES_VER" | cut -d " " -f 3) >> "$GITHUB_ENV"
          echo K9S_VERSION=$(go list -f '{{.Version}}' -m github.com/derailed/k9s) >> "$GITHUB_ENV"
          echo CRANE_VERSION=$(go list -f '{{.Version}}' -m github.com/google/go-containerregistry) >> "$GITHUB_ENV"
          echo SYFT_VERSION=$(go list -f '{{.Version}}' -m github.com/anchore/syft) >> "$GITHUB_ENV"
          echo ARCHIVES_VERSION=$(go list -f '{{.Version}}' -m github.com/mholt/archives) >> "$GITHUB_ENV"
          echo HELM_VERSION=$(go list -f '{{.Version}}' -m helm.sh/helm/v4) >> "$GITHUB_ENV"
          echo ZARF_VERSION=$(go list -f '{{.Version}}' -m github.com/zarf-dev/zarf) >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.17.1
          args: release --clean --verbose --config .goreleaser.unstable.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag_name }}

      - name: Verify published Linux amd64 artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir verify
          gh release download "$TAG_NAME" --dir verify --pattern '*Linux*' --pattern 'checksums.txt'
          (cd verify && sha256sum --ignore-missing -c checksums.txt)
          binary_count=$(find verify -maxdepth 1 -type f -name '*_Linux_amd64' ! -name '*.sbom' | wc -l)
          test "$binary_count" -eq 1
          binary=$(find verify -maxdepth 1 -type f -name '*_Linux_amd64' ! -name '*.sbom')
          chmod +x "$binary"
          "$binary" version | tee verify/legacy-version.txt
          "$binary" --features=NextMode=true version | tee verify/next-version.txt
          grep -F "uds version $TAG_NAME" verify/legacy-version.txt
          grep -F "uds version $TAG_NAME" verify/next-version.txt

  cleanup-nightlies:
    needs:
      - prepare
      - publish
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove older nightly releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t nightly_tags < <(gh release list --limit 100 --order desc --json tagName,isPrerelease --jq '.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\+"))) | .tagName')
          for tag_name in "${nightly_tags[@]:3}"; do
            gh release delete "$tag_name" --cleanup-tag --yes
          done
