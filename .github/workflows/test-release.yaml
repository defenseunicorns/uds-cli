name: Release Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets: inherit
    with:
      include_ghcr_write: true
      include_uds_core_smoke: true
