name: Release Tests

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate in the release test workflow
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      ref: ${{ inputs.ref }}
      include_ghcr_write: true
      include_uds_core_smoke: true
