name: UDS Core Smoke Test
on:
  schedule:
    - cron: '0 7 * * *' ## Every day at 0700 UTC

  workflow_dispatch:

permissions:
  contents: read

# Abort prior jobs in the same workflow / PR
concurrency:
  group: uds-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uds-core-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        type: [with-cluster, without-cluster]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup golang
        uses: ./.github/actions/golang

      - name: Install Maru
        uses: ./.github/actions/install-maru

      - name: Build UDS-CLI binary
        run: maru run build-cli-linux-amd

      - name: Make UDS-CLI executable
        run: |
          chmod +x build/uds

      - name: Setup K3d
        uses: ./.github/actions/k3d
        with:
          create-cluster: "${{ matrix.type == 'with-cluster' && 'true' || 'false'}}"

      - name: Run UDS Core smoke test
        run: maru run test:legacy-ci-uds-core-smoke-test
        shell: bash
