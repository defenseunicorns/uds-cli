name: Publish UDS-CLI Release

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      goreleaser_config:
        required: true
        type: string
      environment:
        required: true
        type: string
      homebrew:
        required: false
        default: false
        type: boolean
    secrets:
      HOMEBREW_TAP_WORKFLOW_GITHUB_APP_ID:
        required: false
      HOMEBREW_TAP_WORKFLOW_GITHUB_APP_SECRET:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: uds-ubuntu-big-boy-16-core
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Free up disk space
        if: ${{ inputs.homebrew }}
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force

      - name: Setup development tools
        uses: ./.github/actions/mise

      - name: Install tools
        uses: ./.github/actions/install-tools

      - name: Setup release environment
        shell: bash
        run: |
          set -euo pipefail
          K8S_MODULES_VER=$(go list -f '{{.Version}}' -m k8s.io/client-go | sed 's/v//; s/\./ /g')
          echo K8S_MODULES_MAJOR_VER=$(expr $(echo "$K8S_MODULES_VER" | cut -d " " -f 1) + 1) >> "$GITHUB_ENV"
          echo K8S_MODULES_MINOR_VER=$(echo "$K8S_MODULES_VER" | cut -d " " -f 2) >> "$GITHUB_ENV"
          echo K8S_MODULES_PATCH_VER=$(echo "$K8S_MODULES_VER" | cut -d " " -f 3) >> "$GITHUB_ENV"
          echo K9S_VERSION=$(go list -f '{{.Version}}' -m github.com/derailed/k9s) >> "$GITHUB_ENV"
          echo CRANE_VERSION=$(go list -f '{{.Version}}' -m github.com/google/go-containerregistry) >> "$GITHUB_ENV"
          echo SYFT_VERSION=$(go list -f '{{.Version}}' -m github.com/anchore/syft) >> "$GITHUB_ENV"
          echo ARCHIVES_VERSION=$(go list -f '{{.Version}}' -m github.com/mholt/archives) >> "$GITHUB_ENV"
          echo HELM_VERSION=$(go list -f '{{.Version}}' -m helm.sh/helm/v4) >> "$GITHUB_ENV"
          echo ZARF_VERSION=$(go list -f '{{.Version}}' -m github.com/zarf-dev/zarf) >> "$GITHUB_ENV"

      - name: Get Brew tap repo token
        if: ${{ inputs.homebrew }}
        id: brew-tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_WORKFLOW_GITHUB_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_WORKFLOW_GITHUB_APP_SECRET }}
          owner: defenseunicorns
          repositories: homebrew-tap

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.17.1
          args: release --clean --verbose --config ${{ inputs.goreleaser_config }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.brew-tap-token.outputs.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag_name }}

      - name: Verify published Linux amd64 artifact
        if: ${{ !inputs.homebrew }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir verify
          gh release download "$TAG_NAME" --dir verify --pattern '*Linux*' --pattern 'checksums.txt'
          (cd verify && sha256sum --ignore-missing -c checksums.txt)
          binary_count=$(find verify -maxdepth 1 -type f -name '*_Linux_amd64' ! -name '*.sbom' | wc -l)
          test "$binary_count" -eq 1
          binary=$(find verify -maxdepth 1 -type f -name '*_Linux_amd64' ! -name '*.sbom')
          chmod +x "$binary"
          "$binary" version | tee verify/legacy-version.txt
          "$binary" --features=NextMode=true version | tee verify/next-version.txt
          grep -F "uds version $TAG_NAME" verify/legacy-version.txt
          grep -F "uds version $TAG_NAME" verify/next-version.txt
