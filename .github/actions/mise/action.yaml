name: Setup mise
description: Install the repository-pinned development tools

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        # renovate: datasource=github-releases depName=jdx/mise versioning=semver
        version: 2026.10.3
        install: true
        cache: true

    - name: Locate Go caches
      id: go-cache
      shell: bash
      run: |
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

    - name: Cache Go dependencies and build artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-cache.outputs.mod }}
          ${{ steps.go-cache.outputs.build }}
        key: ${{ runner.os }}-go-${{ steps.go-cache.outputs.version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ steps.go-cache.outputs.version }}-
