name: setup-from-previous
description: Download the previously built UDS CLI and prepare the test environment

inputs:
  create-cluster:
    description: Whether to create a K3d cluster
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Download UDS CLI binary
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: uds-binary
        path: build/

    - name: Setup development tools
      uses: ./.github/actions/mise

    - name: Make UDS CLI executable
      shell: bash
      run: chmod +x build/uds

    - name: Setup K3d
      uses: ./.github/actions/k3d
      with:
        create-cluster: ${{ inputs.create-cluster }}
