kind: ZarfPackageConfig
metadata:
  name: nginx
  version: 0.0.1

components:
  - name: nginx
    required: true
    manifests:
      - name: simple-nginx-deployment
        namespace: nginx
        files:
          - refs/deployment.yaml
    actions:
      onDeploy:
        after:
          - wait:
              cluster:
                kind: deployment
                name: nginx-deployment
                namespace: nginx
                condition: available
    images:
      - nginx:1.31.3 # use shorthand for nginx!
