# This file is included by tasks.yaml under the `test` alias. Task references in
# this file are therefore bare, while callers use the external `test:<name>` form.
tasks:
  - name: unit
    description: Run unit tests
    actions:
      - cmd: go test ./... -failfast -v -timeout 5m
        dir: src/pkg
      - cmd: go test ./... -failfast -v -timeout 5m
        dir: src/cmd

  - name: integration
    description: Run cluster-free CLI integration tests
    actions:
      - cmd: UDS_CLI_PATH=$(pwd)/build/uds go test -v -count=1 -tags=integration ./src/test/integration/...

  - name: integration-cluster
    description: Run integration tests against the local UDS dev-stack k3d cluster
    actions:
      - cmd: UDS_CLI_PATH=$(pwd)/build/uds go test -v -count=1 -timeout 50m -tags=cluster_integration ./src/test/cluster/...

  - name: uds-core-smoke
    description: Run UDS Core smoke tests against disposable k3d clusters
    actions:
      - cmd: UDS_CLI_PATH=$(pwd)/build/uds go test -v -count=1 -tags=uds_core_smoke ./src/test/smoke/...

  - name: ghcr-write
    description: Run privileged GHCR-write tests
    actions:
      - cmd: UDS_CLI_PATH=$(pwd)/build/uds go test -v -count=1 -tags=ghcr_write ./src/test/ghcr/...

  - name: all
    description: Run all non-privileged test tiers
    actions:
      - task: unit
      - task: integration
      - task: integration-cluster
      - task: uds-core-smoke
